<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Courier New', monospace;
  background: #000;
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* BACKGROUND FIX */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
  pointer-events: none;
}

/* NAV */
.topnav {
  background: #000;
  display: flex;
  justify-content: flex-end;
  padding: 10px 30px;
  border-bottom: 1px solid red;
  position: relative;
  z-index: 2;
}

.topnav a {
  color: #fff;
  padding: 10px 15px;
  text-decoration: none;
}

.topnav a:hover {
  background: red;
  color: black;
}

/* DROPDOWN */
.dropdown { position: relative; }

.dropdown-content {
  display: none;
  position: absolute;
  background: #111;
  top: 40px;
  right: 0;
  min-width: 160px;
  border: 1px solid red;
  z-index: 10;
}

.dropdown-content a {
  display: block;
  padding: 10px;
}

.dropdown-content a:hover {
  background: red;
  color: black;
}

.show { display: block; }

.arrow { transition: 0.3s; }
.rotate { transform: rotate(180deg); }

/* HEADER */
header {
  padding: 20px;
  border-bottom: 1px solid red;
}

/* HERO */
.hero {
  max-width: 1225px;
  margin: 30px auto;
}

.hero img {
  width: 100%;
  border-radius: 10px;
  border: 2px solid red;
  box-shadow: 0 0 20px red;
}

/* OUTPUTS */
.outputs { margin-top: 40px; }

.line {
  width: 200px;
  height: 4px;
  background: red;
  margin: auto;
  margin-bottom: 20px;
}

/* CARD */
.card {
  background: #1f1f1f;
  margin: 15px auto;
  padding: 20px;
  width: 80%;
  max-width: 600px;
  border: 2px solid red;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
  font-size: 20px;
}

.card:hover {
  background: red;
  color: black;
  transform: scale(1.05);
}

/* PANEL */
.panel {
  max-height: 0;
  overflow: hidden;
  transition: 0.5s;
  background: #111;
  width: 90%;
  margin: auto;
  border-radius: 10px;
}

.panel-content { padding: 30px; }

/* PDF */
.pdf-preview {
  width: 100%;
  max-width: 800px;
  height: 500px;
  margin: 20px auto;
  border: 3px solid red;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
}

.pdf-preview iframe {
  width: 100%;
  height: 100%;
  border: none;
  pointer-events: none;
}

/* FOOTER */
footer {
  padding: 20px;
  border-top: 1px solid red;
  margin-top: 40px;
}

/* VIEWER */
#viewer, #pdfViewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  z-index: 999;
  justify-content: center;
  align-items: center;
}

#viewer { background: rgba(0,0,0,0.95); }

#pdfViewer { background: #000; }

#viewer img {
  max-width: 90%;
  max-height: 80%;
}

#pdfFrame {
  width: 100%;
  height: 100%;
  border: none;
}

.close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: red;
  color: white;
  padding: 10px;
  cursor: pointer;
}
/* Motto quote */
.quote {
  font-size: 30px;
  font-weight: bold;
  color: #fff;
  font-style: italic;
  margin-bottom: 20px;
  background: rgba(14, 13, 13, 0.6);
  padding: 12px 18px;
  border-radius: 12px;
  display: inline-block;
}

/* SLIDESHOW CONTAINER */
.slideshow {
  width: 80%;
  max-width: 800px;
  margin: auto;
  border-radius: 15px;
  overflow: hidden;
  border: 2px solid red;
  box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
}

/* IMAGE STYLE */
.slideshow img {
  width: 100%;
  height: 450px;
  object-fit: cover;
  transition: opacity 1s ease-in-out;
}

/* NAVBAR */
.topnav {
  background-color: #000;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.topnav a {

/* Logo stays on the left */
.logo {

.logo a {

/* Year */

</style>

<!-- SCRIPTS -->
<script>
function toggleMenu() {
  document.getElementById("dropdownMenu").classList.toggle("show");
  document.getElementById("arrow").classList.toggle("rotate");
}

window.onclick = function(e) {
  if (!e.target.closest('.dropdown')) {
    document.getElementById("dropdownMenu").classList.remove("show");
    document.getElementById("arrow").classList.remove("rotate");
  }
};

const cards = document.querySelectorAll(".card");

cards.forEach(card => {
  card.addEventListener("click", () => {
    const panel = card.nextElementSibling;

    document.querySelectorAll(".panel").forEach(p => {
      if (p !== panel) p.style.maxHeight = null;
    });

    panel.style.maxHeight = panel.style.maxHeight ? null : panel.scrollHeight + "px";
  });
});

function openViewer(img){
  document.getElementById("viewer").style.display = "flex";
  document.getElementById("viewer-img").src = img.src;
}

function closeViewer(){
  document.getElementById("viewer").style.display = "none";
}

function openPDF(file){
  document.getElementById("pdfViewer").style.display = "block";
  document.getElementById("pdfFrame").src = file;
}

function closePDF(){
  document.getElementById("pdfViewer").style.display = "none";
}
</script>

<script>
const images = [
  "18.jpg",
  "19.jpg",
  "20.jpg"
];

let index = 0;
const slide = document.getElementById("slide");

setInterval(() => {
  index = (index + 1) % images.length;
  
  // fade effect
  slide.style.opacity = 0;

  setTimeout(() => {
    slide.src = images[index];
    slide.style.opacity = 1;
  }, 400);

}, 5000);
</script>

<!-- MATRIX BACKGROUND -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 6;

let renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

renderer.domElement.style.position = "fixed";
renderer.domElement.style.top = "0";
renderer.domElement.style.left = "0";
renderer.domElement.style.zIndex = "-1";
renderer.domElement.style.pointerEvents = "none";

const COUNT = 300;
const MAX_DISTANCE = 1.5;

let positions = new Float32Array(COUNT * 3);
let velocities = new Float32Array(COUNT * 3);

for (let i = 0; i < COUNT * 3; i += 3) {
  positions[i] = (Math.random() - 0.5) * 10;
  positions[i+1] = (Math.random() - 0.5) * 10;
  positions[i+2] = (Math.random() - 0.5) * 10;

  velocities[i] = (Math.random() - 0.5) * 0.02;
  velocities[i+1] = (Math.random() - 0.5) * 0.02;
  velocities[i+2] = (Math.random() - 0.5) * 0.02;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));

const mat = new THREE.PointsMaterial({
  color: 0xff1a1a,
  size: 0.05,
  transparent: true,
  opacity: 0.9
});

const particles = new THREE.Points(geo, mat);
scene.add(particles);

const lineGeo = new THREE.BufferGeometry();
const linePos = new Float32Array(COUNT * COUNT * 3);
lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3));

const lineMat = new THREE.LineBasicMaterial({
  color: 0xff0000,
  transparent: true,
  opacity: 0.12
});

const lines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(lines);

function animate(){
  requestAnimationFrame(animate);

  for (let i = 0; i < COUNT * 3; i += 3) {
    positions[i] += velocities[i];
    positions[i+1] += velocities[i+1];
    positions[i+2] += velocities[i+2];

    for (let j = 0; j < 3; j++) {
      if (positions[i+j] > 5 || positions[i+j] < -5) {
        velocities[i+j] *= -1;
      }
    }
  }

  particles.geometry.attributes.position.needsUpdate = true;

  let pos = particles.geometry.attributes.position.array;
  let index = 0;

  for (let i = 0; i < COUNT; i++) {
    for (let j = i + 1; j < COUNT; j++) {

      const dx = pos[i*3] - pos[j*3];
      const dy = pos[i*3+1] - pos[j*3+1];
      const dz = pos[i*3+2] - pos[j*3+2];

      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

      if (dist < MAX_DISTANCE) {
        linePos[index++] = pos[i*3];
        linePos[index++] = pos[i*3+1];
        linePos[index++] = pos[i*3+2];

        linePos[index++] = pos[j*3];
        linePos[index++] = pos[j*3+1];
        linePos[index++] = pos[j*3+2];
      }
    }
  }

  lines.geometry.setDrawRange(0, index / 3);
  lines.geometry.attributes.position.needsUpdate = true;

  particles.rotation.y += 0.001;
  lines.rotation.y += 0.001;

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
